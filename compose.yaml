# 本地课程演示编排：数据库和 Redis 持久化，API/Worker/调度器分进程运行。
name: campus-reserve

x-backend-environment: &backend-environment
# API、Worker 和调度器共享同一组连接与令牌参数，避免环境漂移。
  APP_NAME: ${APP_NAME:-CampusReserve}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_DSN: ${POSTGRES_DSN:-postgresql+asyncpg://campus:campus_dev_password@postgres:5432/campus_reserve}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  BOOKING_STREAM: ${BOOKING_STREAM:-campus-reserve:{booking}:reservation-events}
  BOOKING_DEAD_LETTER_STREAM: ${BOOKING_DEAD_LETTER_STREAM:-campus-reserve:{booking}:reservation-events:dead-letter}
  BOOKING_CONSUMER_GROUP: ${BOOKING_CONSUMER_GROUP:-booking-workers}
  BOOKING_CLAIM_IDLE_MS: ${BOOKING_CLAIM_IDLE_MS:-30000}
  BOOKING_MAX_DELIVERIES: ${BOOKING_MAX_DELIVERIES:-5}
  BOOKING_RESULT_TTL_SECONDS: ${BOOKING_RESULT_TTL_SECONDS:-604800}
  JWT_SECRET: ${JWT_SECRET:-course-design-only-secret-change-before-release}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-campus-reserve}
  JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}

x-backend-build: &backend-build
  context: .
  dockerfile: deploy/docker/backend.Dockerfile

services:
  # 迁移任务在 PostgreSQL 健康后执行，业务进程等待迁移成功。
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_reserve}
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 双 API 实例由 Nginx 分配请求；健康接口也用于容器就绪判断。
  api-1:
    build: *backend-build
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
      INSTANCE_NAME: api-1
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api-2:
    build: *backend-build
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
      INSTANCE_NAME: api-2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # 两个消费者加入同一 Stream 消费组，可接管彼此超时的未确认消息。
  booking-worker-1:
    build: *backend-build
    command: ["python", "-m", "apps.booking_worker.main"]
    environment:
      <<: *backend-environment
      WORKER_CONSUMER_NAME: booking-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); assert r.get('campus-reserve:worker:booking-worker-1:heartbeat') == b'ok'"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  booking-worker-2:
    build: *backend-build
    command: ["python", "-m", "apps.booking_worker.main"]
    environment:
      <<: *backend-environment
      WORKER_CONSUMER_NAME: booking-worker-2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); assert r.get('campus-reserve:worker:booking-worker-2:heartbeat') == b'ok'"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # 定时进程补齐库存并将结束时段的预约归档。
  scheduler:
    build: *backend-build
    command: ["python", "-m", "apps.scheduler.main"]
    environment:
      <<: *backend-environment
      SCHEDULER_INSTANCE: scheduler-1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); assert r.get('campus-reserve:scheduler:scheduler-1:heartbeat') == b'ok'"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Nginx 同时提供前端静态文件和 /api 反向代理。
  nginx:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    restart: unless-stopped

  locust:
    build: *backend-build
    command: ["locust", "-f", "tests/load/locustfile.py", "--host", "http://nginx"]
    environment: *backend-environment
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "8089:8089"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
