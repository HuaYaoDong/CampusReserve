# Keep accidental traffic bounded without masking the course benchmark target of 5,000 RPS.
limit_req_zone $binary_remote_addr zone=campus_api_limit:10m rate=6000r/s;
limit_req_zone $binary_remote_addr zone=campus_login_limit:10m rate=10r/s;

upstream campus_api {
    # 双 API 实例按当前连接数分配流量。
    least_conn;
    server api-1:8000;
    server api-2:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        # 登录含密码哈希计算，使用独立且更低的限流桶。
        limit_req zone=campus_login_limit burst=20 nodelay;
        proxy_pass http://campus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=campus_api_limit burst=10000 nodelay;
        proxy_pass http://campus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Vue 客户端路由回退到入口 HTML。
        try_files $uri $uri/ /index.html;
    }
}
