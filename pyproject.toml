# Python 项目构建、运行依赖及测试/静态检查配置集中在此。
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-reserve"
version = "0.1.0"
description = "Course-design MVP for a high-concurrency campus badminton reservation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "locust>=2.32,<3",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Lua 脚本必须随 Python 包一起分发，预约服务运行时会从包路径读取。
campus_reserve = ["bookings/infrastructure/lua/*.lua"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = ["integration: requires the Docker PostgreSQL/Redis services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
